<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .card h2 { text-align: center; margin-bottom: 15px; color: #38bdf8; }
    .status-box { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #94a3b8; }
    .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <h2>Payment Portal</h2>
  <div class="status-box">
    Token Detected: <strong id="token-display" style="color: #4ade80;">Checking...</strong>
  </div>

  <form id="pay-form">
    <div class="input-group">
      <label for="upi">Bind UPI / Paytm Account</label>
      <input type="text" id="upi" placeholder="example@paytm" required>
    </div>
    <div class="input-group">
      <label for="amount">Enter Amount (₹)</label>
      <input type="number" id="amount" placeholder="500" required>
    </div>
    <button type="submit" class="btn">Proceed</button>
  </form>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token') || 'No Token Provided';
  document.getElementById('token-display').innerText = token;

  document.getElementById('pay-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const upi = document.getElementById('upi').value;
    const amt = document.getElementById('amount').value;
    alert('Processing payment for UPI: ' + upi + ' Amount: ₹' + amt);
  });
</script>

</body>
</html>
